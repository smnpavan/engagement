<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Admin — Bhavana & Pavan</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Noto+Serif:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fef7ec;--card:#fffaf0;--card2:#f8eedb;--ink:#3b2a1a;--mute:#7a6247;--gold:#a97c2f;--line:#e6d4aa;--mar:#5b1a24}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 "Noto Serif",Georgia,serif;text-align:center}
h1{font:400 clamp(40px,9vw,56px)/1.2 "Great Vibes",cursive;color:var(--mar);margin:0}
.box,#dash{max-width:760px;margin:0 auto;padding:40px 20px}
form{display:grid;gap:14px;max-width:360px;margin:20px auto;padding:28px;background:var(--card);border:1px solid var(--gold);outline:1px solid var(--line);outline-offset:5px}
input{width:100%;padding:12px;border:1px solid var(--gold);background:var(--card2);font:inherit;text-align:center}
.btn{border:0;background:linear-gradient(135deg,#6e2230,var(--mar));color:#f8e9c6;padding:10px 22px;font:600 12px "Noto Serif",serif;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;box-shadow:inset 0 0 0 1px var(--gold)}
.btn.o{background:var(--card);color:var(--mar);box-shadow:inset 0 0 0 1px var(--gold)}.err{color:#a4452c;font-size:14px;min-height:20px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:18px 0}.stats div{background:var(--card);border:1px solid var(--line);padding:12px}.stats b{display:block;font:700 28px "Noto Serif",serif;color:var(--mar)}
.tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:14px 0}.tabs .on{background:var(--mar);color:#f8e9c6}
.w{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--gold);padding:16px;margin:12px 0;text-align:left}.w small{color:var(--mute)}.w p{margin:8px 0;white-space:pre-wrap}
.st{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}.st.pending{color:#b26a00}.st.rejected{color:#a4452c}.st.approved{color:#2f6b4f}
</style></head><body>
<div class="box" id="login"><h1>Admin</h1><form id="lf"><input type="email" id="em" placeholder="Email" required autocomplete="username"><input type="password" id="pw" placeholder="Password" required autocomplete="current-password"><div class="err" id="le"></div><button class="btn">Sign in</button></form></div>
<div id="dash" style="display:none"><h1>Wishes &amp; Blessings</h1><div class="stats" id="st"></div>
 <div><button class="btn o" id="rf">Refresh</button> <button class="btn o" id="lo">Sign out</button></div>
 <div class="tabs" id="tabs"><button class="btn o on" data-f="all">All</button><button class="btn o" data-f="pending">Pending</button><button class="btn o" data-f="approved">Approved</button><button class="btn o" data-f="rejected">Rejected</button></div>
 <div id="list"></div></div>
<script src="../config.js"></script>
<script>
const SB=window.SB_CONFIG||{},$=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let tok=sessionStorage.getItem("tk")||"",all=[],flt="all";
const hdr=()=>({apikey:SB.key,Authorization:"Bearer "+tok,"Content-Type":"application/json"});
function out(msg){tok="";sessionStorage.removeItem("tk");$("#dash").style.display="none";$("#login").style.display="block";$("#le").textContent=msg||""}
async function load(){try{const r=await fetch(SB.url+"/rest/v1/wishes?select=*&order=created_at.desc&limit=500",{headers:hdr()});if(r.status===401||r.status===403){out("Session expired — please sign in again.");return}all=await r.json();$("#login").style.display="none";$("#dash").style.display="block";render()}catch(e){out("Could not reach the database.")}}
function render(){const c=x=>all.filter(w=>w.status===x).length;
 $("#st").innerHTML=[["Total",all.length],["Approved",c("approved")],["Pending",c("pending")],["Rejected",c("rejected")]].map(x=>`<div><b>${x[1]}</b>${x[0]}</div>`).join("");
 const l=all.filter(w=>flt==="all"||w.status===flt);
 $("#list").innerHTML=l.length?l.map(w=>`<div class="w"><span class="st ${esc(w.status)}">${esc(w.status)}</span> · <small>${esc(new Date(w.created_at).toLocaleString())}</small><p><b>${esc(w.name)}</b><br>${esc(w.message)}</p><button class="btn" data-a="approved" data-id="${esc(w.id)}">Approve</button> <button class="btn o" data-a="rejected" data-id="${esc(w.id)}">Reject</button> <button class="btn o" data-a="del" data-id="${esc(w.id)}">Delete</button></div>`).join(""):"<p>Nothing here yet.</p>"}
$("#list").onclick=async e=>{const b=e.target.closest("button");if(!b)return;const id=b.dataset.id,a=b.dataset.a;if(a==="del"&&!confirm("Delete this message permanently?"))return;
 const u=SB.url+"/rest/v1/wishes?id=eq."+encodeURIComponent(id);
 try{const r=a==="del"?await fetch(u,{method:"DELETE",headers:hdr()}):await fetch(u,{method:"PATCH",headers:{...hdr(),Prefer:"return=minimal"},body:JSON.stringify({status:a})});if(r.status===401){out("Session expired — please sign in again.");return}if(!r.ok){alert("Action failed");return}load()}catch(x){alert("Action failed")}};
$("#tabs").onclick=e=>{const b=e.target.closest("button");if(!b)return;flt=b.dataset.f;document.querySelectorAll("#tabs button").forEach(x=>x.classList.toggle("on",x===b));render()};
$("#rf").onclick=load;$("#lo").onclick=()=>out("");
$("#lf").onsubmit=async e=>{e.preventDefault();$("#le").textContent="";
 try{const r=await fetch(SB.url+"/auth/v1/token?grant_type=password",{method:"POST",headers:{apikey:SB.key,"Content-Type":"application/json"},body:JSON.stringify({email:$("#em").value.trim(),password:$("#pw").value})});const d=await r.json();if(!r.ok||!d.access_token)throw 0;tok=d.access_token;sessionStorage.setItem("tk",tok);$("#pw").value="";load()}catch(x){$("#le").textContent="Wrong email or password."}};
if(tok)load();
</script></body></html>
